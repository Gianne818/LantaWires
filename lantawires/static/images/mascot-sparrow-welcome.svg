<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- chubby happy sparrow, front view -->
  <!-- tail -->
  <path d="M62 112 L54 128 L70 122 L78 130 L86 120 Z" fill="#C96F3B" stroke="#4a2a18" stroke-width="4" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="80" cy="74" rx="40" ry="42" fill="#FFB085" stroke="#4a2a18" stroke-width="4"/>
  <!-- cream face patch -->
  <ellipse cx="80" cy="76" rx="28" ry="28" fill="#FFF6EC"/>
  <!-- sparrow cap -->
  <path d="M42 62 Q48 34 80 32 Q112 34 118 62 Q100 48 80 48 Q60 48 42 62 Z" fill="#8A5A3B" stroke="#4a2a18" stroke-width="4" stroke-linejoin="round"/>
  <!-- happy closed eyes ^ ^ -->
  <path d="M56 72 Q62 64 68 72" stroke="#4a2a18" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M92 72 Q98 64 104 72" stroke="#4a2a18" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- blush -->
  <ellipse cx="54" cy="84" rx="6" ry="4" fill="#FF6B6B" opacity="0.6"/>
  <ellipse cx="106" cy="84" rx="6" ry="4" fill="#FF6B6B" opacity="0.6"/>
  <!-- CLEAR BEAK: two-tone diamond with outline + smile -->
  <path d="M70 88 L90 88 L80 102 Z" fill="#FFC53D" stroke="#4a2a18" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M70 88 L90 88" stroke="#4a2a18" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M73 93 Q80 98 87 93" stroke="#4a2a18" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- wings -->
  <path d="M42 80 Q32 90 36 102 Q46 98 50 88 Z" fill="#FF8F5E" stroke="#4a2a18" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M118 80 Q128 90 124 102 Q114 98 110 88 Z" fill="#FF8F5E" stroke="#4a2a18" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- feet -->
  <path d="M68 114 L68 122 M92 114 L92 122" stroke="#4a2a18" stroke-width="4" stroke-linecap="round"/>
</svg>
